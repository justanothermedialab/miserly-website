# Builds the site (the landing at /, the guide at /docs from the app's repo) and publishes it on GitHub Pages.
# Runs on every push to main, by hand (Actions, Pages, Run workflow), and once a day, so a change to the guide
# in the app's repo reaches the site by the next morning without a commit here.
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      ref:
        description: Branch or tag of the app's repo to take the guide from
        default: main
  schedule:
    - cron: '30 1 * * *' # 07:00 IST

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # GitHub Pages runs only from a public repo here, so nothing is built while this one is private.
  check:
    runs-on: ubuntu-latest
    outputs:
      public: ${{ steps.visibility.outputs.public }}
    steps:
      - id: visibility
        run: echo "public=$(gh api "repos/$GITHUB_REPOSITORY" --jq '.private | not')" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ github.token }}

  build:
    needs: check
    if: needs.check.outputs.public == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check out the site
        uses: actions/checkout@v4

      - name: Check out the guide's pages from the app's repo
        uses: actions/checkout@v4
        with:
          repository: justanothermedialab/miserly
          ref: ${{ inputs.ref || 'main' }}
          path: _miserly
          sparse-checkout: docs/user-guide/pages

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: docs/package-lock.json

      - name: Install
        run: npm ci --no-audit --no-fund
        working-directory: docs

      - name: Build
        run: node scripts/build.mjs _miserly

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
